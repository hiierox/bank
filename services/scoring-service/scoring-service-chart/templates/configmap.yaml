apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "scoring-service.configmap.name" . }}
  namespace: {{ .Values.student.namespace }}
  labels:
    {{ include "scoring-service.selectorLabels.custom" . | nindent 4 }}
data:
  KAFKA_BOOTSTRAP_SERVERS: {{ .Values.kafka.bootstrapServers}}
  KAFKA_TOPIC: {{ .Values.kafka.topic }}
  KAFKA_GROUP_ID: {{ .Values.kafka.groupId }}
  DATA_SERVICE_BASE_URL: {{ .Values.dataService.baseUrl}}