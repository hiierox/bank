apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "user-data-service.configmap.name" . }}
  namespace: {{ .Values.student.namespace }}
  labels:
    {{ include "user-data-service.selectorLabels.custom" . | nindent 4 }}
data:
  KAFKA_BOOTSTRAP_SERVERS: {{ .Values.kafka.bootstrapServers }}
  KAFKA_TOPIC: {{ .Values.kafka.topic }}
  KAFKA_GROUP_ID: {{ .Values.kafka.groupId }}