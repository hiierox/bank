apiVersion: v1
kind: Service
metadata:
  name: user-data-service-{{ .Values.student.name }}
  namespace: {{ .Values.student.namespace }}
  labels:
    {{ include "user-data-service.selectorLabels.custom" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{ include "user-data-service.selectorLabels.custom" . | nindent 4 }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.port }}
      protocol: TCP
      name: http
  