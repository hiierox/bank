apiVersion: v1
kind: Service
metadata:
  name: flow-selection-service-{{ .Values.student.name }}
  labels:
    {{- include "flow-service-chart.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "flow-service-chart.selectorLabels" . | nindent 4 }}
