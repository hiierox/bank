apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "flow-selection-service.configmap.name" . }}
  namespace: {{ .Values.student.namespace }}
  labels:
    {{ include "flow-selection-service.selectorLabels.custom" . | nindent 4 }}
data:
  DATA_SERVICE_BASE_URL: {{ .Values.dataService.baseUrl}}
  DATA_SERVICE_MAX_ATTEMPTS: {{ .Values.dataService.maxAttempts | quote}}
  DATA_SERVICE_DELAY: {{ .Values.dataService.delay | quote }}
  DATA_SERVICE_TIMEOUT: {{ .Values.dataService.timeout | quote }}
  REDIS_HOST: {{ .Values.redis.host | quote }}
  REDIS_PORT: {{ .Values.redis.port | quote }}
  REDIS_TTL: {{ .Values.redis.ttl | quote }}
