image: python:3.12-slim
stages:
  - linting
  - type-checking
  - testing
  - build

.base:
  tags:
    - docker
  before_script:
    - pip install poetry
  rules:
    - when: never

linting_flow:
  extends: .base
  stage: linting
  script:
    - cd services/flow-service
    - poetry install --no-root
    - poetry run ruff check src/
  rules:
    - changes:
        - "services/flow-service/**/*.py"
        - ".gitlab-ci.yml"
        - "services/flow-service/poetry.lock"
      when: on_success
    - changes:
        - "**/*.md"
      when: never
    - when: never

mypy_flow:
  extends: .base
  stage: type-checking
  script:
    - cd services/flow-service
    - poetry install --no-root
    - poetry run mypy src/
  rules:
    - changes:
        - "services/flow-service/**/*.py"
        - ".gitlab-ci.yml"
        - "services/flow-service/poetry.lock"
      when: on_success
    - changes:
        - "**/*.md"
      when: never
    - when: never

tests_flow:
  extends: .base
  stage: testing
  script:
    - cd services/flow-service
    - poetry install --no-root
    - poetry run pytest
  coverage: '/TOTAL.*\s+(\d+%)$/'
  rules:
    - changes:
        - "services/flow-service/**/*.py"
        - ".gitlab-ci.yml"
        - "services/flow-service/poetry.lock"
      when: on_success
    - changes:
        - "**/*.md"
      when: never
    - when: never

