.docker-build:
  tags:
    - shell
  stage: build
  image: docker:28
  before_script:
    - unset DOCKER_AUTH_CONFIG
    - docker login -u $CI_REGISTRY_USER -p $CI_JOB_TOKEN $CI_REGISTRY
  script:
    - docker build
      -t "$CI_REGISTRY_IMAGE/$IMAGE_NAME:latest"
      -f "$SERVICE_PATH/Dockerfile"
      "$SERVICE_PATH"
    - docker push "$CI_REGISTRY_IMAGE/$IMAGE_NAME:latest"
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - "$SERVICE_PATH/**/*"

build_data_service:
  extends: .docker-build
  variables:
    SERVICE_PATH: "services/user-data-service"
    IMAGE_NAME: "data-service"

build_scoring_service:
  extends: .docker-build
  variables:
    SERVICE_PATH: "services/scoring-service"
    IMAGE_NAME: "scoring-service"

build_flow_selection_service:
  extends: .docker-build
  variables:
    SERVICE_PATH: "services/flow-service"
    IMAGE_NAME: "flow-service"

build_antifraud_service:
  extends: .docker-build
  variables:
    SERVICE_PATH: "services/antifraud-service"
    IMAGE_NAME: "antifraud-service"

cache:
  key:
    files:
      - poetry.lock
    prefix: "$CI_COMMIT_REF_SLUG"
  paths:
    - root/.cache/pypoetry
    - root/.cache/pip
