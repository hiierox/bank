tests_data:
  extends: .base
  stage: testing
  services:
    - name: postgres:17-alpine
      alias: postgres_test
  variables:
    POSTGRES_DB: test
    POSTGRES_USER: test
    POSTGRES_PASSWORD: test
    DATABASE_URL: "postgresql+asyncpg://test:test@postgres_test:5432/test"
  script:
    - cd services/user-data-service
    - poetry install --no-root
    - poetry run alembic upgrade head
    - poetry run pytest
  coverage: '/TOTAL.*\s+(\d+%)$/'
  rules:
