server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: все пути отдаём index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Прокси к flow-service (убираем CORS — запросы с того же origin)
    # FastAPI ожидает POST /api/products/ (trailing slash) — добавляем слэш, чтобы избежать 307
    location /api/flow/ {
        rewrite ^(/api/flow/api/products)$ $1/ last;
        proxy_pass http://flow-service:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Прокси к scoring-service
    location /api/scoring/ {
        proxy_pass http://scoring-service:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
